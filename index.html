<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Віяло карт з анімацією. Практика.">
    <meta name="author" content="Volodymyr Pohorilyi">
    <meta name="copyright" content="Copyright 2026">
    <link rel="stylesheet" href="./styles/main.css">
    <title>Document</title>
</head>

<body>

    <header>
        <div class="logo">
            <svg class="logo-icon">
                <use href="./icon/sprite.svg#logo"></use>
            </svg>
            <span class="logo-text">Playing Cards</span>
        </div>

        <ul class="header-list">
            <li class="header-item">Video</li>
            <li class="header-item">Audio</li>
            <li class="header-item">Links</li>
        </ul>
    </header>

    <div class="card-fan">
        <div class="card">
            <span>A</span>
            <svg width="100" height="100" viewBox="0 0 100 100">
                <path fill="crimson" d="M 50 90
       C 10 60, 0 35, 20 15
       C 35 2, 50 15, 50 28
       C 50 15, 65 2, 80 15
       C 100 35, 90 60, 50 90
       Z" />
            </svg>
        </div>

        <div class="card">
            <span>K</span>
            <svg class="icon">
                <use href="./icon/sprite.svg#club"></use>
            </svg>
        </div>

        <div class="card">
            <span>Q</span>
            <svg class="icon red">
                <use href="./icon/sprite.svg#diamond"></use>
            </svg>
        </div>

        <div class="card">
             <svg class="icon">
                <use href="./icon/sprite.svg#spade"></use>
            </svg>
        </div>
    </div>
</body>

</html>
